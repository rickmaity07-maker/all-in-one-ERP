# Builds the Android app, attaches the signed APK to the GitHub Release, and tests it on emulators.
#
# Trigger: the same v* tags as the desktop release (or run it by hand from the Actions tab).
# Required repository secrets, besides the ones release.yml uses:
#   ANDROID_KEYSTORE_BASE64    base64 of ~/.android-erp/erp-release.jks (every update must use this key)
#   ANDROID_KEYSTORE_PASSWORD  contents of ~/.android-erp/keystore.password
#   E2E_OWNER_EMAIL / E2E_OWNER_PASSWORD   the test owner account the E2E suite signs in with
name: Android

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run the emulator test suites
        type: boolean
        default: true

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;29.0.14206865" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Release APK (signed, real phones + emulators)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/erp-release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/erp-release.jks"
          npx tauri android build --apk --target aarch64 --target x86_64
          mkdir -p dist-android
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "dist-android/all-in-one-erp-${{ steps.v.outputs.version }}.apk"

      - name: Test APK (debug build numbered 0.0.1 so the in-app update check has something to offer)
        run: |
          npx tauri android build --debug --apk --target x86_64 --config '{"version":"0.0.1"}'
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk dist-android/test-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apks
          path: dist-android/

      - name: Attach the APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The desktop workflow creates the release; wait for it (up to 30 min).
          for i in $(seq 1 60); do gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break; sleep 30; done
          gh release upload "$GITHUB_REF_NAME" dist-android/all-in-one-erp-*.apk --clobber

  test:
    needs: build
    if: github.event_name == 'push' || inputs.run_tests
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: full     # every desktop E2E test, on a tablet-size screen (desktop layout)
            profile: pixel_c
          - suite: phone    # phone layout + Android-only tests
            profile: pixel_6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: dist-android
      - name: Web build for the second (browser) user in the chat test
        run: |
          npm run build
          nohup npx --yes serve@14 out -l 3000 > serve.log 2>&1 &
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_ANDROID_PKG: com.allinoneerp.app.debug
          E2E_ANDROID_VERSION: 0.0.1
          E2E_SUITE: ${{ matrix.suite }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          ram-size: 4096M
          disk-size: 6G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash scripts/android-ci-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results-${{ matrix.suite }}
          path: |
            test-results/
            reports/
            playwright-report-android-${{ matrix.suite }}/
